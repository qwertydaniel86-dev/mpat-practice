var ROTS=(function(){var id=[0,1,2,3,4,5],seen={},q=[id],out=[];

  txt(x+s,y,top,s*.45,'font-weight="bold"')+txt(x+s/2,y+h/2+s/2,front,s*.45,'font-weight="bold"')+txt(x+1.5*s,y+h/2+s/2,right,s*.45,'font-weight="bold"');

    if(!views.some(function(w){return w.join()==v.join();}))views.push(v);}

  var cons=PERM6.filter(function(pm){var lab=pm.map(function(i){return L[i];});
    return views.every(function(v){return ROTS.some(function(r){return lab[r[0]]==v[0]&&lab[r[2]]==v[1]&&lab[r[5]]==v[2];});});});
  var OPP=[1,0,3,2,5,4];
  var cands=shuf(L).filter(function(x){var ans=null,ok=true;cons.forEach(function(pm){var lab=pm.map(function(i){return L[i];});var o=lab[OPP[lab.indexOf(x)]];if(ans===null)ans=o;else if(ans!==o)ok=false;});return ok;});
  if(!cands.length)continue;
  var x=cands[0];var lab0=cons[0].map(function(i){return L[i];});var ans=lab0[OPP[lab0.indexOf(x)]];
  var f='';views.forEach(function(v,i){f+=cubeSVG(v[0],v[1],v[2],10+i*110,40,48)+txt(58+i*110,165,'('+(i+1)+')',13);});
  var wrong=shuf(L.filter(function(y){return y!==x&&y!==ans;}));

   'Faces adjacent to '+x+' in any view cannot be opposite it. Working through the views, only '+ans+' is never adjacent to '+x+' and fits all three views. (Reviewer tip: if two views share a letter, compare the faces around it.)','G',svg(340,180,f));
 }

 var ah=(ft%1000)/1000*2*Math.PI,at=(ft/10000)*2*Math.PI;
 f+='<line x1="90" y1="90" x2="'+(90+36*Math.sin(at))+'" y2="'+(90-36*Math.cos(at))+'" stroke="#fff" stroke-width="7" stroke-linecap="round"/><line x1="90" y1="90" x2="'+(90+70*Math.sin(ah))+'" y2="'+(90-70*Math.cos(ah))+'" stroke="#fff" stroke-width="3"/><circle cx="90" cy="90" r="5" fill="#fff"/>'+txt(90,120,'ALT ft',10,'fill="#aaa"');return svg(180,180,f);}
function genDRT(){switch(R(0,3)){
 case 0:var max=pick([100,160,200,240]),step=max/(max==160?8:max==240?6:5)*1,mi=step/2,v=R(0,max/mi)*mi;
  return mk('drt','Read the instrument (knots):',v,numWrong(v,[mi,step,mi*3],function(d){return d>=0&&d<=max;}),'Major marks every '+step+', minor every '+mi+'. Needle is at '+v+'.','G',gauge(v,max,step,'KNOTS'));
 case 1:var ft=R(1,95)*100;
  return mk('drt','Read the altimeter. Long needle = hundreds, short thick needle = thousands.',ft+' ft',numWrong(ft,[1000,100,200,900],function(d){return d>0&&d<10000;}).map(function(d){return d+' ft';}),'Short needle between '+Math.floor(ft/1000)+' and '+(Math.floor(ft/1000)+1)+' → '+Math.floor(ft/1000)+',000; long needle on '+((ft%1000)/100)+' → '+(ft%1000)+'. Total '+ft+' ft.','G',alti(ft));
 case 2:var v=R(0,8),names=['E','1/8','1/4','3/8','1/2','5/8','3/4','7/8','F'],f='<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#000" stroke-width="3"/>';
  for(var i=0;i<=8;i++){var a=(-90+i*22.5)*Math.PI/180;f+='<line x1="'+(100+70*Math.sin(a))+'" y1="'+(100-70*Math.cos(a))+'" x2="'+(100+80*Math.sin(a))+'" y2="'+(100-80*Math.cos(a))+'" stroke="#000" stroke-width="'+(i%2?1:3)+'"/>';if(i%4==0)f+=txt(100+92*Math.sin(a),100-92*Math.cos(a)+4,['E','1/2','F'][i/4],12);}
  var a=(-90+v*22.5)*Math.PI/180;f+='<line x1="100" y1="100" x2="'+(100+68*Math.sin(a))+'" y2="'+(100-68*Math.cos(a))+'" stroke="#c00" stroke-width="4"/>';
  return mk('drt','The fuel tank holds 80 L. How much fuel remains?',(v*10)+' L',numWrong(v*10,[10,20,30],function(d){return d>=0&&d<=80;}).map(function(d){return d+' L';}),'Needle at '+names[v]+' of 80 L = '+(v*10)+' L. Each small mark = 1/8 tank = 10 L.','G',svg(200,115,f));
 default:var h=R(0,35)*10,f='<circle cx="90" cy="90" r="80" fill="#fff" stroke="#000" stroke-width="3"/>';
  for(var d=0;d<360;d+=10){var a=d*Math.PI/180;f+='<line x1="'+(90+(d%30?70:64)*Math.sin(a))+'" y1="'+(90-(d%30?70:64)*Math.cos(a))+'" x2="'+(90+78*Math.sin(a))+'" y2="'+(90-78*Math.cos(a))+'" stroke="#000"/>';if(d%90==0)f+=txt(90+52*Math.sin(a),90-52*Math.cos(a),'NESW'[d/90],15,'font-weight="bold"');else if(d%30==0)f+=txt(90+52*Math.sin(a),90-52*Math.cos(a),d/10,11);}
  var a=h*Math.PI/180;f+=arrow(90,90,90+66*Math.sin(a),90-66*Math.cos(a),'#c00');
  var fmt=function(x){x=((x%360)+360)%360;return ('00'+x).slice(-3)+'°';};
  return mk('drt','What heading does the arrow show? (Numbers = tens of degrees; N=0, E=90, S=180, W=270.)',fmt(h),shuf(uniq([h+10,h-10,h+20,h-30,h+180,h+90,h-90].map(fmt))).slice(0,3),'Count marks (10° each) from the nearest labelled one: '+fmt(h)+'.','G',svg(180,180,f));
}}

/* ---------- ARITHMETIC ---------- */
function genArith(){var a,b,c,q,ans;switch(R(0,5)){
 case 0:a=R(12,99);b=R(12,99);c=R(11,79);q=a+' + '+b+' − '+c;ans=a+b-c;break;
 case 1:a=R(100,999);b=R(100,999);q=a+' + '+b;ans=a+b;break;
 case 2:a=R(200,999);b=R(100,a);q=a+' − '+b;ans=a-b;break;
 case 3:a=R(6,25);b=R(3,19);q=a+' × '+b;ans=a*b;break;
 case 4:b=R(3,15);ans=R(4,25);a=b*ans;q=a+' ÷ '+b;break;
 default:a=R(20,90);b=R(10,60);c=R(10,60);var d=R(5,40);q=a+' − '+b+' + '+c+' − '+d;ans=a-b+c-d;}
 return mk('arith',q+' = ?',ans,numWrong(ans,[1,2,10,11,9]),q+' = '+ans+'.');}

/* ---------- WORD PROBLEMS ---------- */
var PAIRS=[[3,6,2],[4,12,3],[6,12,4],[10,15,6],[12,24,8],[20,30,12],[15,30,10],[24,40,15],[6,30,5],[12,36,9],[20,60,15],[30,60,20],[18,36,12],[8,24,6],[9,18,6],[12,60,10]];
function genWord(){var u=pick(['hours','minutes','days']);switch(R(0,7)){
 case 0:var p=pick(PAIRS);return mk('word','Ana can finish a job in '+p[0]+' '+u+'; Ben can finish it in '+p[1]+' '+u+'. Working together, how long will it take?',p[2]+' '+u,numWrong(p[2],[1,2,3],function(d){return d>0;}).map(function(d){return d+' '+u;}),'Product over sum: ('+p[0]+'×'+p[1]+')/('+p[0]+'+'+p[1]+') = '+p[2]+'.');
 case 1:var p=pick(PAIRS);return mk('word','Two workers together finish a job in '+p[2]+' '+u+'. One of them alone takes '+p[1]+' '+u+'. How long would the other take alone?',p[0]+' '+u,numWrong(p[0],[1,2,4,p[2]],function(d){return d>0&&d!==p[1];}).map(function(d){return d+' '+u;}),'1/'+p[2]+' − 1/'+p[1]+' = 1/'+p[0]+'.');
 case 2:var IO=[[3,6,6],[4,12,6],[6,12,12],[2,3,6],[10,15,30],[12,20,30],[8,24,12],[4,6,12],[5,20,20/3*0+0]];var p=pick(IO.slice(0,8));
  return mk('word','A pipe fills a tank in '+p[0]+' hours, but a leak empties the full tank in '+p[1]+' hours. With both open, how long to fill the empty tank?',p[2]+' hours',numWrong(p[2],[1,2,3,4],function(d){return d>0;}).map(function(d){return d+' hours';}),'1/'+p[0]+' − 1/'+p[1]+' = 1/'+p[2]+'. Drain is a negative rate.');
 case 3:for(;;){var a=R(4,20),b=R(3,20),h=R(1,a-1),t=(a-h)*b/(a+b);if(t===Math.floor(t)&&t>0)break;}
  return mk('word','A can do a job in '+a+' hours and B in '+b+' hours. A works alone for '+h+' hours, then B joins. How many MORE hours to finish?',t+' hours',numWrong(t,[1,2,3],function(d){return d>0;}).map(function(d){return d+' hours';}),'Remaining work = 1 − '+h+'/'+a+' = '+(a-h)+'/'+a+'. Together rate = 1/'+a+' + 1/'+b+'. Time = '+(a-h)+'·'+b+'/('+a+'+'+b+') = '+t+'.');
 case 4:var T3=pick([[2,3,6,1],[4,6,12,2],[6,10,15,3],[10,15,30,5],[12,20,30,6],[3,6,6,1.5]]),k=pick([1,2,4]);var x=T3.map(function(v){return v*k;});
  return mk('word','A, B and C can each finish a task in '+x[0]+', '+x[1]+' and '+x[2]+' hours. Working together, how long?',x[3]+' hours',numWrong(x[3],[1,2,k],function(d){return d>0;}).map(function(d){return d+' hours';}),'Add rates: 1/'+x[0]+' + 1/'+x[1]+' + 1/'+x[2]+' = 1/'+x[3]+'. Product-over-sum does NOT work for three.');
 case 5:for(;;){var k=R(3,5),m=R(2,k-1),n=R(2,20),num=(m-1)*n,den=k-m;if(num%den===0&&num/den>=2)break;}var s=num/den;
  return mk('word','A father is '+k+' times as old as his son. In '+n+' years he will be '+m+' times as old as his son. How old is the son now?',s,numWrong(s,[1,2,3,n],function(d){return d>0;}),k+'s + '+n+' = '+m+'(s + '+n+') → s = '+s+'.');
 case 6:var T=R(2,10)*16,go=T/4,back=go*1.25,tot=go+back;
  return mk('word','A plane\'s tank holds '+T+' L. The outbound leg uses 1/4 of the tank; the return uses 25% more fuel than the outbound leg. How much fuel is used in total?',tot+' L',[go*2+' L',(T*5/8)+' L',back+' L',(T*3/4)+' L'].filter(function(x){return x!==tot+' L';}),'Out = '+go+' L; back = 1.25×'+go+' = '+back+' L; total '+tot+' L.');
 default:var pts='ABCDEF',segs=[];for(var i=0;i<5;i++)segs.push(R(2,15));var i=R(0,3),j=R(i+2,5),d=0;for(var k2=i;k2<j;k2++)d+=segs[k2];
  var f='<line x1="10" y1="40" x2="370" y2="40" stroke="#000" stroke-width="2"/>',x=10,tot=segs.reduce(function(a,b){return a+b;},0);
  for(var p=0;p<6;p++){f+='<circle cx="'+x+'" cy="40" r="4"/>'+txt(x,20,pts[p],14,'font-weight="bold"');if(p<5){f+=txt(x+segs[p]/tot*180,58,segs[p],12);x+=segs[p]/tot*360;}}
  return mk('word','Points A–F lie on a straight road; distances between neighbours are shown (km). How far is '+pts[i]+' from '+pts[j]+'?',d+' km',numWrong(d,[1,2,segs[i],segs[j-1]],function(x){return x>0;}).map(function(x){return x+' km';}),'Add the segments from '+pts[i]+' to '+pts[j]+': '+segs.slice(i,j).join(' + ')+' = '+d+'.','G',svg(380,70,f));
}}

/* ---------- MECHANICAL generated ---------- */
function genMechCalc(){switch(R(0,3)){
 case 0:for(;;){var t1=R(2,12)*5,t2=R(2,12)*5,r=R(2,30)*10,o=r*t1/t2;if(o===Math.floor(o)&&t1!==t2)break;}
  return mk('mech','A '+t1+'-tooth gear turning at '+r+' rpm drives a '+t2+'-tooth gear. Speed of the driven gear?',o+' rpm',uniq([r*t2/t1,r,o*2,o+10,o*3]).filter(function(x){return x!==o;}).map(function(x){return (Math.round(x*10)/10)+' rpm';}),'rpm × teeth is constant: '+r+'×'+t1+'/'+t2+' = '+o+'.');
 case 1:var n=R(2,7),cw=Math.random()<.5,last=(n%2===1)==cw?'Clockwise':'Counterclockwise';
  return mk('mech','In a chain of '+n+' meshed gears in a line, gear 1 turns '+(cw?'clockwise':'counterclockwise')+'. Gear '+n+' turns:',last,[last=='Clockwise'?'Counterclockwise':'Clockwise','It does not turn','Alternates back and forth'],'Each mesh reverses direction: odd-numbered gears match gear 1.');
 case 2:var L=R(2,20)*10,la=R(1,4),ea=la*R(2,5),e=L*la/ea;
  return mk('mech','A lever lifts a '+L+' N load placed '+la+' m from the fulcrum. Effort is applied '+ea+' m from the fulcrum. Effort needed?',e+' N',numWrong(e,[e,5,10,L/2],function(d){return d>0;}).map(function(d){return d+' N';}),'Load × load arm = effort × effort arm → '+L+'×'+la+'/'+ea+' = '+e+' N.');
 default:var n=R(2,6),W=n*R(5,40);
  return mk('mech','A load of '+W+' N hangs from a pulley system with '+n+' rope segments supporting the movable block. Ideal effort needed?',(W/n)+' N',numWrong(W/n,[W/n,5,10],function(d){return d>0;}).map(function(d){return d+' N';}),'Ideal MA = number of supporting strands = '+n+'. '+W+'/'+n+' = '+(W/n)+' N.');
}}

/* ---------- STATIC → items ---------- */
function staticItems(){var out=[];
 ANALOGY.forEach(function(a){out.push(mk('analogy',a[0],a[1],a[2],a[3],'O'));});
 RELATION.forEach(function(a){out.push(mk('relation',a[0],a[1],a[2],a[3],'O'));});
 MECH.forEach(function(a){out.push(mk('mech',a[0],a[1],a[2],a[3],a[4]));});
 ENGINE.forEach(function(a){out.push(mk('engine',a[0],a[1],a[2],a[3],a[4]));});
 ENGINE_PARTS.forEach(function(p){var o=shuf(ENGINE_PARTS.filter(function(x){return x!==p;})).slice(0,3);
  out.push(mk('engine','Engine part: <b>'+p[0]+'</b>. What does it do?',p[1],o.map(function(x){return x[1];}),p[0]+': '+p[1]+'.','R'));
  out.push(mk('engine','Which engine part: "'+p[1]+'"?',p[0],o.map(function(x){return x[0];}),p[0]+': '+p[1]+'.','R'));});
 READING.forEach(function(r){r.qs.forEach(function(q){out.push(mk('reading','<div class="passage">'+r.p+'</div>'+q[0],q[1],q[2],'See passage.',r.src));});});
 out.push(mk('word','Two men working together finish a job in 24 minutes. One of them alone can do it in 40 minutes. How long would the other take alone?','60 minutes',['16 minutes','64 minutes','48 minutes'],'1/24 − 1/40 = (5−3)/120 = 1/60 → 60 min. (Reviewer item.)','R'));
 out.push(mk('vocab','<b>OBSTINATE</b> most nearly means:','Stubborn',['Obvious','Generous','Fragile'],'Obstinate = stubbornly refusing to change.','R'));
 return out;}
var GENS={cube:genCube,top:genTop,clock:genClock,defect:genDefect,vocab:genVocab,synant:genSynAnt,vector:genVector,drt:genDRT,arith:genArith,word:genWord,mech:genMechCalc};
</script><script>var MEM={};var LS={get:function(k){try{return LS.get(k);}catch(e){return MEM[k]||null;}},set:function(k,v){try{LS.set(k,v);}catch(e){MEM[k]=v;}}};
var STATIC=staticItems(),S=null,TICK=null;
var $=function(id){return document.getElementById(id);};
function deckFor(topic){return shuf(STATIC.filter(function(x){return !topic||x.t===topic;}));}
function nextItem(){var t=S.topic;
 if(!t){var keys=Object.keys(TOPICS);t=pick(keys);}
 var hasGen=!!GENS[t],st=S.decks[t]||(S.decks[t]=deckFor(t));
 var it;if(hasGen&&(!st.length||Math.random()<.7))it=GENS[t]();else{if(!st.length)st=S.decks[t]=deckFor(t);it=st.pop();}
 it=JSON.parse(JSON.stringify(it));if(!it.fixed)it.ch=shuf(it.ch);return it;}
function start(mode,topic){var secs=mode==='10'?600:300;S={mode:mode,topic:topic||null,decks:{},log:[],end:Date.now()+secs*1000,secs:secs};
 show('quiz');ask();clearInterval(TICK);TICK=setInterval(tick,250);tick();}
function tick(){var r=Math.max(0,Math.round((S.end-Date.now())/1000));$('timer').textContent=Math.floor(r/60)+':'+('0'+r%60).slice(-2);$('timer').className=r<=30?'low':'';if(r<=0)finish();}
function ask(){var it=S.cur=nextItem();S.sel=null;$('qnum').textContent='Q'+(S.log.length+1)+' · '+TOPICS[it.t];
 $('qtext').innerHTML=it.q;$('qfig').innerHTML=it.fig;
 $('choices').innerHTML=it.ch.map(function(c,i){return '<button class="ch" data-i="'+i+'">'+(it.fixed?'':'ABCD'[i]+'. ')+c+'</button>';}).join('');
 Array.prototype.forEach.call(document.querySelectorAll('.ch'),function(b){b.onclick=function(){S.sel=it.ch[+b.dataset.i];document.querySelectorAll('.ch').forEach(function(x){x.classList.remove('sel');});b.classList.add('sel');$('next').disabled=false;};});
 $('next').disabled=true;window.scrollTo(0,0);}
function record(skip){var it=S.cur;S.log.push({it:it,sel:skip?null:S.sel,ok:!skip&&S.sel===it.a});}
function finish(){clearInterval(TICK);if(!S)return;var log=S.log,ok=log.filter(function(l){return l.ok;}).length,ans=log.filter(function(l){return l.sel!==null;}).length;
 var key=S.topic?'topic:'+S.topic:'mixed'+S.mode,H=JSON.parse(LS.get('mpatHist')||'{}');var prev=H[key];
 var rec={ok:ok,n:log.length,date:new Date().toLocaleString()};if(!prev||ok>prev.ok)H[key]=rec;
 var runs=JSON.parse(LS.get('mpatRuns')||'[]');runs.unshift({k:key,ok:ok,n:log.length,d:rec.date});LS.set('mpatRuns',JSON.stringify(runs.slice(0,20)));LS.set('mpatHist',JSON.stringify(H));
 var by={};log.forEach(function(l){var b=by[l.it.t]||(by[l.it.t]={ok:0,n:0});b.n++;if(l.ok)b.ok++;});
 var h='<h2>Score: '+ok+' / '+log.length+'</h2><p>Answered '+ans+', skipped '+(log.length-ans)+'. Accuracy on answered: '+(ans?Math.round(ok/ans*100):0)+'%'+(!prev||ok>prev.ok?' · <b>New best!</b>':' · Best: '+prev.ok)+'</p><table><tr><th>Topic</th><th>Correct</th></tr>';
 Object.keys(by).forEach(function(t){h+='<tr><td>'+TOPICS[t]+'</td><td>'+by[t].ok+' / '+by[t].n+'</td></tr>';});h+='</table><h3>Review of missed items</h3>';
 log.forEach(function(l,i){if(l.ok)return;h+='<div class="rev"><div class="small">Q'+(i+1)+' · '+TOPICS[l.it.t]+'</div><div>'+l.it.q+'</div>'+l.it.fig+'<p>Your answer: <span class="bad">'+(l.sel===null?'(skipped)':l.sel)+'</span><br>Correct: <span class="good">'+l.it.a+'</span></p><p class="small">'+l.it.e+'</p></div>';});
 $('result').innerHTML=h;S=null;show('res');}
function show(id){['home','quiz','res'].forEach(function(x){$(x).style.display=x===id?'block':'none';});if(id==='home')renderHome();}
function renderHome(){var H=JSON.parse(LS.get('mpatHist')||'{}');
 $('topics').innerHTML=Object.keys(TOPICS).map(function(t){var b=H['topic:'+t];return '<button class="tp" onclick="start(\'5\',\''+t+'\')">'+TOPICS[t]+(b?'<span class="small"> best '+b.ok+'/'+b.n+'</span>':'')+'</button>';}).join('');
 $('best').innerHTML=['5','10'].map(function(m){var b=H['mixed'+m];return m+'-min best: '+(b?b.ok+'/'+b.n+' ('+b.date+')':'—');}).join('<br>');}
(function(){$('next').onclick=function(){record(false);ask();};$('skip').onclick=function(){record(true);ask();};$('stop').onclick=function(){finish();};show('home');})();
</script></body></html>
